<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Schéma original KODI (démonstration) : intersection sans signalisation, vue de dessus. -->
  <rect width="400" height="300" fill="#dfe8d6"/>
  <rect x="160" y="0" width="80" height="300" fill="#5b6472"/>
  <rect x="0" y="110" width="400" height="80" fill="#5b6472"/>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="14 10">
    <line x1="200" y1="0" x2="200" y2="105"/>
    <line x1="200" y1="195" x2="200" y2="300"/>
    <line x1="0" y1="150" x2="155" y2="150"/>
    <line x1="245" y1="150" x2="400" y2="150"/>
  </g>
  <!-- Vous : voiture bleue venant du bas, arrêtée avant l'intersection. -->
  <g transform="translate(206 205)">
    <rect width="28" height="46" rx="6" fill="#287cff"/>
    <rect x="5" y="6" width="18" height="10" rx="2" fill="#dbe8ff"/>
  </g>
  <text x="248" y="236" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101b30">Vous</text>
  <!-- Véhicule prioritaire : voiture verte venant de votre droite. -->
  <g transform="translate(300 118)">
    <rect width="46" height="28" rx="6" fill="#1b7a5c"/>
    <rect x="6" y="5" width="10" height="18" rx="2" fill="#ddf6ee"/>
  </g>
  <path d="M292 132 H208" stroke="#1b7a5c" stroke-width="5" fill="none" marker-end="url(#fleche)"/>
  <text x="270" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101b30">Prioritaire</text>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b7a5c"/>
    </marker>
  </defs>
</svg>
