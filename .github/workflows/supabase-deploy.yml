name: Base Supabase — déployer

# Lancement manuel uniquement : GitHub > Actions > « Base Supabase — déployer »
# > Run workflow. Applique les migrations (supabase/migrations) puis charge les
# questions en relecture (supabase/seed/questions.sql) sur le projet Supabase.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (Account > Access Tokens)
#   SUPABASE_PROJECT_REF   identifiant du projet (Project Settings > General)
#   SUPABASE_DB_PASSWORD   mot de passe de la base choisi à la création
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seulement (n’applique rien)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier les secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant : $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lier le projet
        run: npx --yes supabase@2.121.0 link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Simulation
        if: ${{ inputs.dry_run }}
        run: npx --yes supabase@2.121.0 db push --linked --include-seed --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer migrations et questions en relecture
        if: ${{ !inputs.dry_run }}
        run: npx --yes supabase@2.121.0 db push --linked --include-seed --yes --password "$SUPABASE_DB_PASSWORD"
